trigger:
- none

variables:
  backendImage: 'sincodb/comprasapp-backend'
  frontendImage: 'sincodb/comprasapp-frontend'
  tag: '$(Build.BuildId)'
  # Nombre del servicio backend dentro de la red del stack (compras-deploy).
  # Se embebe en el build del frontend (rewrites de next.config.js).
  backendUrl: 'http://backend:3001'

pool:
  name: Bienestar

steps:

- task: Docker@2
  displayName: 'Login DockerHub'
  inputs:
    command: login
    containerRegistry: 'DockerHub'

# BACKEND
- task: Docker@2
  displayName: 'Build & Push backend'
  inputs:
    containerRegistry: 'DockerHub'
    repository: '$(backendImage)'
    command: buildAndPush
    Dockerfile: 'backend/Dockerfile'
    buildContext: 'backend'
    tags: |
      latest
      $(tag)

# FRONTEND (build y push separados: buildAndPush ignora --build-arg)
- task: Docker@2
  displayName: 'Build frontend'
  inputs:
    containerRegistry: 'DockerHub'
    repository: '$(frontendImage)'
    command: build
    Dockerfile: 'frontend/Dockerfile'
    buildContext: 'frontend'
    arguments: '--build-arg BACKEND_URL=$(backendUrl)'
    tags: |
      latest
      $(tag)

- task: Docker@2
  displayName: 'Push frontend'
  inputs:
    containerRegistry: 'DockerHub'
    repository: '$(frontendImage)'
    command: push
    tags: |
      latest
      $(tag)

# VALIDACIÓN
- script: |
    echo "Probando pull..."
    docker pull $(backendImage):latest
    docker pull $(frontendImage):latest
  displayName: 'Verify Images'
