trigger:
- none

variables:
  imageName: 'sincodb/comprasapp'
  tag: '$(Build.BuildId)'

pool:
  name: Bienestar

steps:

- task: Docker@2
  displayName: 'Login DockerHub'
  inputs:
    command: login
    containerRegistry: 'DockerHub'

- task: Docker@2
  displayName: 'Build & Push'
  inputs:
    containerRegistry: 'DockerHub'
    repository: '$(imageName)'
    command: buildAndPush
    Dockerfile: 'Dockerfile'
    buildContext: '.'
    tags: |
      latest
      $(tag)

# VALIDACIÓN
- script: |
    echo "Probando pull..."
    docker pull $(imageName):latest
  displayName: 'Verify Image'
